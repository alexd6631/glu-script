[package]
authors = ["Alexandre Delattre <alexd6631@gmail.com>"]
edition = "2024"
name = "glu_script"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
futures = "0.3"
napi-derive = "3.6.5"
num_enum = "0.7.6"
phf = { version = "0.14.0", features = ["macros"] }

[dependencies.napi]
version = "3.12.4"
features = ["napi10", "tokio_rt"]

[build-dependencies]
napi-build = "2.4.2"

[profile.release]
lto = true
strip = "symbols"
